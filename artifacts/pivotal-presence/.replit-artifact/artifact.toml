kind = "web"
previewPath = "/"
title = "Pivotal Presence"
version = "1.0.0"
id = "artifacts/pivotal-presence"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24752

[services.development]
run = "pnpm --filter @workspace/pivotal-presence run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/pivotal-presence", "run", "build" ]
serve = "static"
publicDir = "artifacts/pivotal-presence/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24752"
BASE_PATH = "/"
